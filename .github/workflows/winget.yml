name: Publish to WinGet
on:
  release:
    types: [ released ]
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        if: github.repository == 'king-of-Jupiter/termora' || github.repository == 'TermoraDev/termora'
        with:
          identifier: Termorator.Termorator
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
